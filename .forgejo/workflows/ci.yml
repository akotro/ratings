name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: [nix-ci]
    steps:
      - uses: https://git.akotro.dev/actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure git
        run: |
          echo "https://akotro:${{ secrets.FJ_TOKEN }}@git.akotro.dev" > ~/.git-credentials
          git config --global credential.helper store
          git config --global user.name "forgejo-bot"
          git config --global user.email "forgejo@users.noreply.git"

      - name: Build
        run: |
          nix develop --accept-flake-config --command \
            nix-fast-build --skip-cached --eval-workers=1 --no-nom
          cat $FORGEJO_STEP_SUMMARY

